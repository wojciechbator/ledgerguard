services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledgerguard
      POSTGRES_USER: ledgerguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerguard}
    volumes:
      - ledgerguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerguard -d ledgerguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ledgerguard:${POSTGRES_PASSWORD:-ledgerguard}@postgres:5432/ledgerguard
      LEDGERGUARD_BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-ledgerguard=info,tower_http=info}
    ports:
      - "127.0.0.1:${LEDGERGUARD_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  ledgerguard-postgres:
