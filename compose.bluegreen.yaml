# Blue-green overlay for LedgerGuard production deploy.
#
# Defines app-green identical to app but with the green image and a
# ledgerguard-app-green network alias. The blue-green deploy script starts
# this alongside the current (blue) app, health-checks it, switches the
# Caddy upstream to the green alias, then stops the old app.
#
# Usage:
#   LEDGERGUARD_GREEN_TAG=sha-<new-sha> \
#   docker compose --env-file .env -f compose.yaml -f compose.bluegreen.yaml \
#     up -d --no-deps app-green

services:
  app-green:
    build:
      context: .
      target: runtime
    image: ledgerguard:${LEDGERGUARD_GREEN_TAG:?Set LEDGERGUARD_GREEN_TAG}
    restart: "no"
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ledgerguard:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/ledgerguard
      LEDGERGUARD_BIND_ADDR: 0.0.0.0:8080
      LEDGERGUARD_ACCOUNTING_PROVIDER: ${LEDGERGUARD_ACCOUNTING_PROVIDER:-saldeo}
      LEDGERGUARD_API_TOKEN: ${LEDGERGUARD_API_TOKEN:-}
      LEDGERGUARD_AUTH_DISABLED: "false"
      LEDGERGUARD_LIVE_SYNC_ENABLED: ${LEDGERGUARD_LIVE_SYNC_ENABLED:-false}
      LEDGERGUARD_MONTHLY_COST_BUDGET: ${LEDGERGUARD_MONTHLY_COST_BUDGET:-}
      LEDGERGUARD_MONTHLY_INCOME: ${LEDGERGUARD_MONTHLY_INCOME:-}
      LEDGERGUARD_TIGHT_SHARE_BASIS_POINTS: ${LEDGERGUARD_TIGHT_SHARE_BASIS_POINTS:-}
      RUST_LOG: ${RUST_LOG:-info}
      LEDGERGUARD_IMAP_HOST: ${LEDGERGUARD_IMAP_HOST:-imap.gmail.com}
      LEDGERGUARD_IMAP_PORT: ${LEDGERGUARD_IMAP_PORT:-993}
      LEDGERGUARD_IMAP_USERNAME: ${LEDGERGUARD_IMAP_USERNAME:-}
      LEDGERGUARD_IMAP_PASSWORD: ${LEDGERGUARD_IMAP_PASSWORD:-}
      LEDGERGUARD_IMAP_SENT_FOLDER: ${LEDGERGUARD_IMAP_SENT_FOLDER:-[Gmail]/Sent Mail}
      LEDGERGUARD_INGEST_RECIPIENT: ${LEDGERGUARD_INGEST_RECIPIENT:-wbator@dok.saldeo.pl}
      LEDGERGUARD_INGEST_SUBJECT: ${LEDGERGUARD_INGEST_SUBJECT:-(5767)}
      LEDGERGUARD_INGEST_LOOKBACK_DAYS: ${LEDGERGUARD_INGEST_LOOKBACK_DAYS:-365}
      SALDEO_BASE_URL: ${SALDEO_BASE_URL:-https://saldeo.brainshare.pl}
      SALDEO_USERNAME: ${SALDEO_USERNAME:-}
      SALDEO_API_TOKEN: ${SALDEO_API_TOKEN:-}
      SALDEO_COMPANY_PROGRAM_ID: ${SALDEO_COMPANY_PROGRAM_ID:-}
      FAKTUROWNIA_ACCOUNT_DOMAIN: ${FAKTUROWNIA_ACCOUNT_DOMAIN:-}
      FAKTUROWNIA_DEPARTMENT_ID: ${FAKTUROWNIA_DEPARTMENT_ID:-}
      FAKTUROWNIA_API_TOKEN: ${FAKTUROWNIA_API_TOKEN:-}
      INFAKT_API_KEY: ${INFAKT_API_KEY:-}
      WFIRMA_ACCESS_KEY: ${WFIRMA_ACCESS_KEY:-}
      WFIRMA_SECRET_KEY: ${WFIRMA_SECRET_KEY:-}
      WFIRMA_APP_KEY: ${WFIRMA_APP_KEY:-}
      WFIRMA_COMPANY_ID: ${WFIRMA_COMPANY_ID:-}
    expose:
      - "8080"
    networks:
      database:
      egress:
      internal:
        aliases:
          - ledgerguard-app-green
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "/ledgerguard", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
