name: Materialize Cargo lock

on:
  push:
    branches: [perf/max-build-size]

permissions:
  contents: write

concurrency:
  group: ledgerguard-materialize-lock
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: perf/max-build-size
      - name: Fetch verified lockfile artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "9405686782"
          EXPECTED_SHA256: "0c4c8bb14439f4e67288cee09b0410fa7c67d84808005eb2d332148b0eee6765"
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/cargo-lock.zip
          unzip -p /tmp/cargo-lock.zip > Cargo.lock
          echo "${EXPECTED_SHA256}  Cargo.lock" | sha256sum --check --strict
      - name: Commit lockfile once
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Commit reproducible Cargo lockfile"
          git push origin HEAD:perf/max-build-size
