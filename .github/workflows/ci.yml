name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ledgerguard-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Same recipes a developer runs locally; no second copy of the gates.
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2
        with:
          tool: just
      - name: Gates (fmt + clippy + panic-free + deploy contract)
        run: just check
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Build release
        run: cargo build --locked --release
      - name: Binary size budget
        shell: bash
        run: |
          bytes=$(stat -c '%s' target/release/ledgerguard)
          mib=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f", bytes / 1048576 }')
          echo "Release binary: ${mib} MiB (${bytes} bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$bytes" -le 15728640

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledgerguard
          POSTGRES_USER: ledgerguard
          POSTGRES_PASSWORD: ledgerguard-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerguard -d ledgerguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ledgerguard:ledgerguard-test@127.0.0.1:5432/ledgerguard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: PostgreSQL repository contract
        run: cargo test --locked --test postgres_repository -- --ignored --nocapture

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ledgerguard-test
        run: docker compose config --quiet
      - name: Build runtime image with reusable main-branch cache
        env:
          CACHE_WRITE: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          cache_args=(--cache-from type=gha,scope=ledgerguard-runtime)
          if [[ "${CACHE_WRITE}" == "true" ]]; then
            cache_args+=(--cache-to type=gha,mode=max,scope=ledgerguard-runtime)
          fi
          docker buildx build \
            --target runtime \
            --tag ledgerguard:ci \
            --load \
            "${cache_args[@]}" \
            .
      - name: Smoke runtime image
        run: docker run --rm ledgerguard:ci --version
      - name: Container size budget
        shell: bash
        run: |
          bytes=$(docker image inspect ledgerguard:ci --format '{{.Size}}')
          mib=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f", bytes / 1048576 }')
          echo "Runtime image: ${mib} MiB (${bytes} bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$bytes" -le 20971520
