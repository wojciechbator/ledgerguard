name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ledgerguard-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Build release
        run: cargo build --locked --release
      - name: Binary size budget
        shell: bash
        run: |
          bytes=$(stat -c '%s' target/release/ledgerguard)
          mib=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f", bytes / 1048576 }')
          echo "Release binary: ${mib} MiB (${bytes} bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$bytes" -le 15728640

  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledgerguard
          POSTGRES_USER: ledgerguard
          POSTGRES_PASSWORD: ledgerguard-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerguard -d ledgerguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ledgerguard:ledgerguard-test@127.0.0.1:5432/ledgerguard
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: PostgreSQL repository contract
        run: cargo test --locked --test postgres_repository -- --ignored --nocapture

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ledgerguard-test
        run: docker compose config --quiet
      - name: Build runtime image
        run: docker build --target runtime --tag ledgerguard:ci .
      - name: Smoke runtime image
        run: docker run --rm ledgerguard:ci --version
      - name: Container size budget
        shell: bash
        run: |
          bytes=$(docker image inspect ledgerguard:ci --format '{{.Size}}')
          mib=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f", bytes / 1048576 }')
          echo "Runtime image: ${mib} MiB (${bytes} bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$bytes" -le 20971520
