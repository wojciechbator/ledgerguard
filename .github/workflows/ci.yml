name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ledgerguard-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Materialize verified dependency lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'perf/max-build-size' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          echo "0c4c8bb14439f4e67288cee09b0410fa7c67d84808005eb2d332148b0eee6765  Cargo.lock" | sha256sum --check --strict
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Commit reproducible Cargo lockfile"
            git push origin HEAD:perf/max-build-size
          fi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Build release
        run: cargo build --release
      - name: Binary size budget
        shell: bash
        run: |
          bytes=$(stat -c '%s' target/release/ledgerguard)
          mib=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f", bytes / 1048576 }')
          echo "Release binary: ${mib} MiB (${bytes} bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$bytes" -le 15728640

  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledgerguard
          POSTGRES_USER: ledgerguard
          POSTGRES_PASSWORD: ledgerguard-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerguard -d ledgerguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ledgerguard:ledgerguard-test@127.0.0.1:5432/ledgerguard
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0
      - name: Generate dependency lockfile
        run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: PostgreSQL repository contract
        run: cargo test --test postgres_repository -- --ignored --nocapture

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ledgerguard-test
        run: docker compose config --quiet
      - name: Build runtime image
        run: docker build --target runtime --tag ledgerguard:ci .
      - name: Smoke runtime image
        run: docker run --rm ledgerguard:ci --version
      - name: Container size budget
        shell: bash
        run: |
          bytes=$(docker image inspect ledgerguard:ci --format '{{.Size}}')
          mib=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f", bytes / 1048576 }')
          echo "Runtime image: ${mib} MiB (${bytes} bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$bytes" -le 20971520
