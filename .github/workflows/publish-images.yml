name: Publish images

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          short_sha="${sha:0:12}"
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          push: true
          build-args: |
            LEDGERGUARD_GIT_SHA=${{ steps.meta.outputs.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha,scope=ledgerguard-runtime
          cache-to: type=gha,mode=max,scope=ledgerguard-runtime
          provenance: false
      - name: Emit digest artifact
        shell: bash
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          printf '%s\n' "$digest" > image-digest.txt
          {
            printf 'LEDGERGUARD_IMAGE_DIGEST=%s\n' "$digest"
            printf 'LEDGERGUARD_GIT_SHA=%s\n' "${{ steps.meta.outputs.sha }}"
            printf 'LEDGERGUARD_BUILD_TIMESTAMP=%s\n' "${{ steps.meta.outputs.timestamp }}"
          } > deploy-metadata.env
      - name: Upload digest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest
          path: |
            image-digest.txt
            deploy-metadata.env
          retention-days: 30
