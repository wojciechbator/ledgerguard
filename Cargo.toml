[package]
name = "ledgerguard"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Cash flow and cost planning service for small businesses"
publish = false

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
md5 = { package = "md-5", version = "0.10" }
rust_decimal = { version = "1.36", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "rust_decimal", "uuid", "migrate"] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7", default-features = false, features = ["catch-panic", "request-id", "set-header", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
uuid = { version = "1.0", default-features = false, features = ["serde", "std", "v4"] }

[dev-dependencies]
rust_decimal_macros = "1.36"
serde_json = "1.0"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
incremental = false

# Fast deployment/staging profile. Production stays on `release`.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16

[profile.release-size]
inherits = "release"
opt-level = "z"
lto = "fat"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
